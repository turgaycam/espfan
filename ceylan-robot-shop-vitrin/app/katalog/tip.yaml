    kelimeler: [sensor*, sensoru, isik bariyer*, isik perde*, fotosel*, yakinlik*, algilayici*, barkod*,
                kamera*, camera*, lazer olcum*, mesafe olcer*, manometre*, termostat*, okuyucu*]
  - anahtar: filtre
    tr: Filtre
    en: Filter
    kelimeler: [filtre*, filter*, emc, emi]
  - anahtar: aku_pil
    tr: Akü / pil
    en: Battery
    kelimeler: [aku, akusu, akuler*, pil, pili, piller*, battery*, batterie*, batarya*]
  - anahtar: transformator
    tr: Transformatör / reaktör
    en: Transformer / reactor
    kelimeler: [transformator*, trafo*, reaktor*, reactor*, transformer*, bobin*]
  - anahtar: lineer
    tr: Lineer kızak / rulman
    en: Linear guide / bearing
    kelimeler: [kizak*, rulman*, ray blog*, lineer*, linear*, bilyali*, burc*, mil, miller*]
  - anahtar: robot
    tr: Robot / robot kontrol ünitesi
    en: Robot / robot controller
    kelimeler: [robot, robotlar, robotu, endustriyel robot*, robot pano*, krc1, krc2, krc4, krc5,
                kr c1, kr c2, kr c4, kr c5, irc5, irc 5, s4]
diger:
